name: Pull Request Checks

on:
  pull_request:
    branches: ["master"]
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test, Credo & Dialyzer
    steps:
      - uses: actions/checkout@v6

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.10.2"
          otp-version: "22"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Authorize hex organization
        run: mix hex.organization auth coingaming --key ${{ secrets.HEX_ORGANIZATION_COINGAMING_KEY }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile protocols
        run: mix compile.protocols --warnings-as-errors

      - name: Run tests
        run: mix coveralls
        env:
          MIX_ENV: test

      - name: Run style checks
        run: mix credo --strict

      - name: Run Dialyzer type checks
        run: mix dialyzer --halt-exit-status
