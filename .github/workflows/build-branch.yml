name: Build Branch

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test, Credo & Dialyzer
    steps:
      - uses: actions/checkout@v6

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-

      - name: Install hex
        run: mix local.hex --force

      - name: Authorize hex organization
        run: mix hex.organization auth coingaming --key "$HEX_ORG_KEY"
        env:
          HEX_ORG_KEY: ${{ secrets.HEX_ORGANIZATION_COINGAMING_KEY }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile protocols
        run: mix compile.protocols --warnings-as-errors

      - name: Run tests
        run: mix coveralls
        env:
          MIX_ENV: test

      - name: Run style checks
        run: mix credo --strict

      - name: Run Dialyzer type checks
        run: mix dialyzer --halt-exit-status

  doc:
    needs: [test]
    runs-on: ubuntu-latest
    name: Build Documentation
    steps:
      - uses: actions/checkout@v6

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Authorize hex organization
        run: mix hex.organization auth coingaming --key "$HEX_ORG_KEY"
        env:
          HEX_ORG_KEY: ${{ secrets.HEX_ORGANIZATION_COINGAMING_KEY }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile protocols
        run: mix compile.protocols --warnings-as-errors

      - name: Compile documentation
        run: mix docs

  semantic-release:
    needs: [test, doc]
    runs-on: ubuntu-latest
    name: Semantic Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run semantic release
        run: npx semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
